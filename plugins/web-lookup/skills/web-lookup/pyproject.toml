[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-lookup"
version = "0.1.0"
description = "Bundled CLI for the web-lookup skill: local page fetch, grep.app, Microsoft Learn, AWS Knowledge MCP, Tavily, Context7"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "tavily-python",
    "requests",
    "python-dotenv",
    "trafilatura",
    "lxml",
]

[project.scripts]
web-lookup = "web_lookup:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
    "web_lookup",
    "env_check",
    "backends",
    "output",
    "page",
    "hints",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
